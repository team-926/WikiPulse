name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --fund=false
      - run: npm run lint
      - run: npm run test:data
      - run: npm run build

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check_compose_env.py

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r db/requirements-test.txt
      - working-directory: db
        run: pytest -q

  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: wikipulse
          POSTGRES_USER: wikipulse
          POSTGRES_PASSWORD: wikipulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wikipulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: wikipulse
      POSTGRES_USER: wikipulse
      POSTGRES_PASSWORD: wikipulse
      DATABASE_URL: postgresql://wikipulse:wikipulse@localhost:5432/wikipulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==8.3.4 requests==2.32.3 "psycopg[binary]==3.3.5" pgserver==0.1.4 pandas==3.0.5 confluent-kafka==2.6.1
      - run: python db/apply_migrations.py
      - name: Test
        working-directory: data-pipeline
        run: |
          pytest -q -ra
          for d in batch spike cluster gkg stock gdelt; do (cd "$d" && pytest -q -ra); done

  pipeline-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==8.3.4 pyspark==3.5.3
      - working-directory: data-pipeline
        run: pytest -q tests/test_edit_windows.py::test_live_pipeline_does_not_crash_when_planning_second_micro_batch
